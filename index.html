<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; connect-src https://api.github.com"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23303443'/></svg>"
    />
    <title>My Projects</title>
  </head>
  <body>
    <h1>My Projects</h1>
    <ul id="projects">
      <li>Loading…</li>
    </ul>

    <script>
      const user = "leonhardweiler";
      const list = document.getElementById("projects");

      fetch(`https://api.github.com/users/${user}/repos?per_page=100`)
        .then((res) => res.json())
        .then((repos) => {
          list.textContent = "";
          for (const repo of repos) {
            if (!repo.has_pages || repo.name === `${user}.github.io`) continue;
            const a = document.createElement("a");
            a.href = `https://${user}.github.io/${repo.name}/`;
            a.textContent = repo.name;
            const li = document.createElement("li");
            li.append(a);
            list.append(li);
          }
        });
    </script>
  </body>
</html>
