<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.github.com"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23303443'/></svg>"
    />
    <title>Repositories</title>
    <style>
      body {
        font-family: monospace;
        color: #eee;
        background: #111;
        margin: 0;
        padding: 1em;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.15em 1.5em 0.15em 0;
        vertical-align: top;
        white-space: nowrap;
      }
      thead th {
        border-bottom: 1px solid #444;
      }
      a {
        color: #eee;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      td.desc {
        white-space: normal;
        color: #888;
      }
      td.age {
        color: #888;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Last commit</th>
        </tr>
      </thead>
      <tbody id="repos" aria-live="polite">
        <tr>
          <td colspan="3">Loading…</td>
        </tr>
      </tbody>
    </table>

    <script>
      // @license magnet:?xt=urn:btih:b8999bbaf509c08d127678643c515b9ab0836bae&dn=ISC.txt ISC
      const user = "leonhardweiler";
      const tbody = document.getElementById("repos");

      function note(text) {
        const td = document.createElement("td");
        td.colSpan = 3;
        td.textContent = text;
        const tr = document.createElement("tr");
        tr.append(td);
        tbody.replaceChildren(tr);
      }

      fetch(`https://api.github.com/users/${user}/repos?per_page=100`)
        .then((res) => res.json())
        .then((repos) => {
          if (!Array.isArray(repos)) throw new Error();
          if (repos.length === 0) return note("No repositories.");
          repos.sort((a, b) => a.name.localeCompare(b.name));
          tbody.replaceChildren(
            ...repos.map((repo) => {
              const link = document.createElement("a");
              link.href = repo.html_url;
              link.textContent = repo.name;

              const name = document.createElement("td");
              name.append(link);

              const desc = document.createElement("td");
              desc.className = "desc";
              desc.textContent = repo.description || "";

              const age = document.createElement("td");
              age.className = "age";
              age.textContent = repo.pushed_at
                ? repo.pushed_at.slice(0, 10)
                : "";

              const tr = document.createElement("tr");
              tr.append(name, desc, age);
              return tr;
            }),
          );
        })
        .catch(() => note("Unable to load repositories."));
      // @license-end
    </script>
  </body>
</html>
