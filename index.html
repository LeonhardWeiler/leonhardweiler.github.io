<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>My Projects</title>
    <style>
    :root {
    --bg: #f9f9f9;
    --text: #111;
    --card-bg: #fff;
    --card-border: #ccc;
    --card-shadow: rgba(0,0,0,0.1);
    }
    @media (prefers-color-scheme: dark) {
    :root {
    --bg: #121212;
    --text: #eee;
    --card-bg: #1e1e1e;
    --card-border: #333;
    --card-shadow: rgba(0,0,0,0.5);
    }
    }

    body {
    font-family: system-ui, sans-serif;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    }
    h1 { text-align: center; margin-bottom: 30px; }

    #projects {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 20px;
    }

    .project {
    display: block;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--card-bg);
    transition: transform 0.2s, box-shadow 0.2s;
    }
    .project:hover {
    transform: scale(1.03);
    box-shadow: 0 4px 12px var(--card-shadow);
    }
    .project img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    }
    .project .info {
    padding: 10px;
    }
    .project .name {
    font-weight: bold;
    margin-bottom: 5px;
    }
    .project .desc {
    font-size: 0.9em;
    color: #555;
    }
    @media (prefers-color-scheme: dark) {
    .project .desc { color: #aaa; }
    }
    </style>
  </head>
  <body>
    <h1>My Projects</h1>
    <div id="projects">Loading projects...</div>

    <script>
const username = "leonhardweiler";
const projectsContainer = document.getElementById("projects");
const CACHE_KEY = "cachedPages";

async function pageExists(url) {
  try {
    const res = await fetch(url, { method: "HEAD" });
    return res.ok;
  } catch {
    return false;
  }
}

async function fetchPagesRepos() {
  try {
    const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
    const repos = await res.json();
    const pageChecks = repos
    .filter(r => r.name !== `${username}.github.io`)
    .map(async repo => {
      const url = `https://${username}.github.io/${repo.name}/`;
      if (await pageExists(url)) {
        return {
          name: repo.name,
          desc: repo.description || "No description",
          url: url,
          img: `https://opengraph.githubassets.com/1/${username}/${repo.name}`
        };
      }
      return null;
    });

    const results = (await Promise.all(pageChecks)).filter(Boolean);

    localStorage.setItem(CACHE_KEY, JSON.stringify(results));

    return results;
  } catch (err) {
    console.error(err);
    return [];
  }
}

function renderProjects(projects) {
  projectsContainer.textContent = "";
  if (projects.length === 0) {
    projectsContainer.textContent = "No active GitHub Pages projects found.";
    return;
  }

  for (const proj of projects) {
    const link = document.createElement("a");
    link.href = proj.url;
    link.className = "project";

    // Repository names and descriptions come from the GitHub API and are
    // untrusted, so build the card with the DOM API and set text content
    // rather than interpolating into innerHTML.
    const img = document.createElement("img");
    img.src = proj.img;
    img.alt = proj.name;

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = proj.name;

    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = proj.desc;

    info.append(name, desc);
    link.append(img, info);
    projectsContainer.appendChild(link);
  }
}

(async function() {
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    renderProjects(JSON.parse(cached));
  }

  const projects = await fetchPagesRepos();
  if (projects.length > 0) {
    renderProjects(projects);
  } else if (!cached) {
    projectsContainer.textContent = "No active GitHub Pages projects found.";
  }
})();
    </script>
  </body>
</html>
